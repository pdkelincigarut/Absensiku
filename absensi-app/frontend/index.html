<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AbsensiKu — Absensi &amp; Penggajian Karyawan</title>

  <!-- Poppins (header) & IBM Plex Mono (sub) sesuai panduan merek KLC.
       Kalau server kantor tanpa internet, font gagal dimuat dan turun ke
       font sistem -- tata letak tetap utuh, hanya hurufnya berbeda.
       Catatan: Tailwind juga sudah dari CDN, jadi ketergantungan internet
       ini bukan hal baru. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Warna diambil langsung dari mockup dan readme aset, bukan ditebak:
       merah latar #be0000 (sama persis dengan latar berkas logo, sehingga
       logo menyatu tanpa jahitan) dan merah tua #b31b32 untuk tombol serta
       elemen aktif. Keluarga font sengaja ditambah sebagai nama baru
       (display/plex), bukan menimpa `sans`/`mono` bawaan, supaya tampilan
       dashboard yang sudah jadi tidak ikut berubah. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            /* `red` khusus latar merek pada halaman login. Sisanya skala
               bernomor seperti palet bawaan Tailwind, supaya penggantian
               warna aksen lama (indigo-600 dan kawan-kawan) menjadi
               pemetaan satu lawan satu, bukan tebak-tebakan per tempat.
               600 adalah merah tua yang diambil dari mockup. */
            klc: {
              red: '#be0000',
              50: '#fdf2f4',
              100: '#fbe3e6',
              200: '#f3c7ce',
              500: '#c42a43',
              600: '#b31b32',
              700: '#96162a'
            }
          },
          fontFamily: {
            display: ['Poppins', 'Segoe UI', 'system-ui', 'sans-serif'],
            plex: ['"IBM Plex Mono"', 'ui-monospace', 'Consolas', 'monospace'],
            /* `mono` bawaan ditimpa supaya kode karyawan, jam, dan angka di
               seluruh dashboard memakai font sub milik merek. */
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    /* Poppins untuk seluruh aplikasi, bukan halaman login saja -- itu font
       merek KLC. Font sistem tetap jadi cadangan kalau CDN tidak terjangkau. */
    body { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    /* Teks yang duduk langsung di atas latar merah harus putih. Aturannya
       dibalik: SEMUA teks di dalam main diputihkan, KECUALI yang berada di
       atas kartu putih.

       Sebelumnya tiap elemen ditandai satu per satu, dan dua kali masih ada
       yang terlewat -- label filter di Riwayat, "Periode Penggajian", dan
       seluruh baris filter Log Perubahan. Membalik aturannya membuat teks
       baru ikut terurus dengan sendirinya. */
    /* `:not(.bg-white)` ikut disertakan, bukan hanya `:not(.bg-white *)`:
       elemen yang latar putihnya menempel pada dirinya sendiri -- misalnya
       tombol Download CSV -- bukan keturunan kartu mana pun, sehingga tanpa
       ini teksnya ikut diputihkan di atas tombol yang juga putih. */
    [data-bg="merek"] main :is(p, span, label, h2, h3, h4, strong, button, a):not(.bg-white):not(.bg-white *) {
      color: #fff;
    }
    /* Keterangan kaki sedikit diredam supaya tidak seramai judul. */
    [data-bg="merek"] main p.text-xs:not(.bg-white):not(.bg-white *),
    [data-bg="merek"] main span.text-xs:not(.bg-white):not(.bg-white *) { color: rgba(255,255,255,.85); }

    /* Kolom isian punya latar putih sendiri, jadi teksnya harus tetap gelap.
       Tanpa ini isian tanggal berubah putih di atas kotak yang juga putih. */
    [data-bg="merek"] main :is(input, select, textarea, option):not(.bg-white *) { color: #0f172a; }

    /* Tombol bergaris di atas merah: garisnya ikut dicerahkan supaya
       bentuknya tetap terbaca, bukan cuma teksnya. */
    [data-bg="merek"] main button.border:not(.bg-white *) {
      border-color: rgba(255,255,255,.55);
    }
    [data-bg="merek"] main button.border:not(.bg-white *):hover {
      background-color: rgba(255,255,255,.12);
    }

    /* ---------- Kenyamanan membaca tabel ----------
       Ditulis sekali di sini, bukan ditempel per berkas, supaya kelima
       tabel (monitoring, riwayat, karyawan, keterlambatan, laporan gaji)
       berperilaku sama dan tidak menyimpang seiring waktu. */

    /* Angka rata secara vertikal. Poppins memakai angka berlebar
       bermacam-macam, sehingga kolom rupiah tampak bergoyang antar baris;
       tabular-nums menyamakan lebar tiap digit. */
    main table { font-variant-numeric: tabular-nums; }

    /* Kepala tabel SENGAJA tidak dibuat menempel. Pembungkus tabel memakai
       overflow-x-auto agar kolom masih bisa digeser di layar sempit, dan itu
       menjadikannya kotak gulir tersendiri -- `position: sticky` lalu
       menempel ke kotak tersebut, bukan ke layar, sehingga baris tabel malah
       tampil di ATAS kepalanya saat digulir. Satu-satunya cara mematikan
       kotak gulir itu adalah membuang gulir mendatarnya, yang berarti kolom
       kanan tidak terjangkau di layar sempit. Keterbacaan kolom di layar
       kecil lebih penting daripada kepala yang menempel.

       Warna kepala tetap dipertegas: abu lebih pekat dan garis bawah yang
       lebih tegas membuat batas antara judul kolom dan isinya jelas. */
    /* Kepala tabel dibedakan lewat bentuk huruf, bukan lewat garis tebal:
       huruf kecil berspasi lebar terbaca jelas sebagai "judul kolom" dan
       tidak bersaing dengan isinya. Cara baku pada tabel data. */
    main thead th {
      background: linear-gradient(#f8fafc, #f1f5f9);
      color: #64748b;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .06em;
      font-weight: 600;
      box-shadow: inset 0 -1px 0 #e2e8f0;
    }

    /* Baris diberi ruang napas sedikit lebih banyak. Tabel sebelumnya rapat
       sehingga mata sulit mengunci satu baris di antara belasan baris lain. */
    main tbody td { padding-top: .7rem; padding-bottom: .7rem; }

    /* Kartu diangkat dari latar. Di atas tekstur merah yang ramai, kartu
       putih tanpa bayangan terlihat seperti tempelan datar; bayangan halus
       memberi jarak antara isi dan latar. */
    [data-bg="merek"] main .bg-white {
      box-shadow: 0 12px 32px -14px rgba(0,0,0,.55), 0 2px 6px -2px rgba(0,0,0,.15);
    }

    /* Kolom pertama jadi jangkar saat mata menyusuri baris ke kanan. */
    main tbody tr > td:first-child { color: #1e293b; }

    /* Teks pendamping di dalam kartu -- kode karyawan, jumlah baris, satuan --
       memakai slate-400 dan kontrasnya cuma 2,5:1 terhadap putih, di bawah
       ambang baca 4,5:1. Dinaikkan satu tingkat: masih jelas lebih redup dari
       teks utama, tapi sudah terbaca. */
    main .bg-white .text-slate-400 { color: #64748b; }

    /* Panah pengurut kolom nyaris tidak terlihat (1,4:1) sehingga tidak
       terbaca sebagai "kolom ini bisa diurutkan". Dinaikkan sampai melewati
       ambang 3:1 yang berlaku untuk elemen non-teks. Yang sedang aktif tetap
       dibedakan lewat warna merah, bukan lewat ketebalan, jadi menaikkan yang
       tidak aktif tidak membuat keduanya tertukar. */
    main thead .text-slate-300 { color: #64748b; }

    /* Sorotan baris saat kursor lewat. Pada tabel selebar Laporan Gaji
       (sebelas kolom) mata gampang tergelincir ke baris sebelah di tengah
       jalan; sorotan ini yang menahannya. */
    main tbody tr:not(.panel-row):hover { background-color: #fff7f7; }

    /* Belang tipis, khusus tabel yang kolomnya banyak. Tidak dipasang ke
       semua tabel: tabel monitoring menyelipkan baris panel yang
       tersembunyi, sehingga "baris genap" di sana bukan baris berikutnya
       yang terlihat dan belangnya akan tampak acak. */
    .table-zebra tbody tr:nth-child(even) { background-color: #fafafa; }
    .table-zebra tbody tr:nth-child(even):hover { background-color: #fff7f7; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tableUtils.js"></script>
  <script src="js/checklist.js"></script>
  <script src="js/employeeList.js"></script>
  <script src="js/latePolicy.js"></script>
  <script src="js/lookups.js"></script>
  <script src="js/schedules.js"></script>
  <script src="js/auditView.js"></script>
  <script src="js/hr.js"></script>
  <script src="js/owner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
